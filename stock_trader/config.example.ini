; 이 파일을 복사해 config.ini 로 저장한 뒤 값을 채우세요.
; config.ini 에는 API 키가 들어가므로 절대 다른 사람과 공유하거나 저장소에 올리지 마세요.

[kiwoom]
; 키움 REST API (https://openapi.kiwoom.com) 에서 발급받은 앱키/시크릿키
; 모의투자 키와 실전 키는 따로 발급됩니다.
appkey =
secretkey =

[mode]
; dry  : 주문 없이 신호만 기록 (가장 안전, 처음엔 이것으로)
; mock : 키움 모의투자 서버로 실제 주문
; real : 실전 계좌 주문 (충분히 검증한 뒤에만!)
mode = dry

[strategy]
; 감시할 종목코드 (공백으로 구분, 10개 이하 권장)
watchlist = 005930 000660 035420 005380 035720
; 변동성 돌파 계수 (백테스트 --sweep 결과로 정하세요)
k = 0.5
; 전일 종가가 N일 이동평균 위일 때만 매매 (0 = 사용 안 함)
ma_filter_days = 5
; 매수가 대비 손절 % (0 = 사용 안 함)
stop_loss_pct = 2.0
; 매수 가능 시간 / 전량 매도 시각 (HH:MM)
buy_start = 09:05
buy_end = 14:30
sell_time = 15:15
; 현재가 확인 주기(초)
poll_seconds = 3

[risk]
; 종목당 매수 금액(원)
budget_per_stock = 500000
; 동시에 보유할 최대 종목 수
max_positions = 3
; 하루 손실 한도(원). 넘으면 전량 매도 후 당일 매매 중지
daily_loss_limit = 50000
; 하루 최대 주문 횟수 (오류로 주문이 반복되는 사고 방지)
max_orders_per_day = 20

[cost]
; 백테스트용 비용 (%). 본인 증권사 수수료/현재 세율에 맞게 수정하세요.
fee_pct = 0.015
tax_pct = 0.20
slippage_pct = 0.10
